name: Deploy to GitHub Pages

# Every push to master runs the checks and, if they pass, publishes the site to
# https://telemiko23.github.io/badge-dna/ . It can also be started by hand from the Actions tab.
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# See docs/deploy.md (including how to take the site down or roll back).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run validate:content
      - run: npm test

      # The site lives under /badge-dna/ on github.io, so assets and the favicon need that base path.
      - run: npm run build
        env:
          BASE_PATH: /badge-dna/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
